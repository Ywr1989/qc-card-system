<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>料号QR扫描</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#000;color:#333;-webkit-tap-highlight-color:transparent}

/* ── Start screen ── */
#startScreen {
  position:fixed;inset:0;z-index:100;
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;text-align:center;padding:24px;
}
#startScreen.hidden{display:none}
#startScreen h1{font-size:24px;margin-bottom:8px}
#startScreen p{font-size:14px;color:#aaa;margin-bottom:32px;max-width:280px;line-height:1.6}
#startScreen button{
  padding:18px 56px;font-size:20px;font-weight:700;
  border:none;border-radius:14px;background:#4a9eff;color:#fff;
  cursor:pointer;box-shadow:0 4px 20px rgba(74,158,255,0.4)
}
#startScreen button:active{background:#3a8eef;transform:scale(0.97)}
#startScreen .note{font-size:12px;color:#666;margin-top:20px}

/* ── Main app ── */
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
#app.hidden{display:none}

#toolbar{
  padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));
  display:flex;gap:8px;align-items:center;
  background:rgba(26,26,46,0.92);z-index:10
}
#searchInput{
  flex:1;min-width:0;padding:10px 12px;
  border:1.5px solid rgba(255,255,255,0.15);border-radius:10px;
  font-size:15px;background:rgba(255,255,255,0.08);color:#fff;outline:none
}
#searchInput::placeholder{color:rgba(255,255,255,0.4)}
#searchInput:focus{border-color:#4a9eff}

#modeBtn,#flashBtn{
  flex-shrink:0;padding:10px 14px;border:none;border-radius:10px;
  font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap
}
#modeBtn{background:#4a9eff;color:#fff}
#modeBtn.browse{background:#34a853}
#flashBtn{background:rgba(255,255,255,0.12);color:#fff;font-size:18px;padding:6px 12px}

#cameraWrap{flex:1;position:relative;background:#000;overflow:hidden;min-height:0}
#video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%}

#popup{
  position:absolute;background:#fff;border-radius:14px;padding:16px 20px;
  box-shadow:0 8px 32px rgba(0,0,0,0.35);z-index:20;max-width:280px;
  opacity:0;transform:scale(0.9);transition:opacity 0.2s,transform 0.2s;pointer-events:none
}
#popup.visible{opacity:1;transform:scale(1);pointer-events:auto}
#popup .label{font-size:12px;color:#999;margin-bottom:4px}
#popup .code{font-size:18px;font-weight:700;color:#1a1a2e;word-break:break-all}
#popup .copyBtn{margin-top:10px;padding:8px 16px;border:none;border-radius:8px;background:#4a9eff;color:#fff;font-size:14px;font-weight:600;cursor:pointer;width:100%}

#statusBar{
  padding:8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom));
  background:rgba(255,255,255,0.95);text-align:center;font-size:12px;color:#888;z-index:10
}

@keyframes scanPulse{0%,100%{opacity:0.6}50%{opacity:1}}
.scanning #statusBar{animation:scanPulse 1.5s ease-in-out infinite}

/* ── Error screen ── */
#errorScreen{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.9);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#errorScreen.visible{display:flex}
#errorScreen h2{font-size:20px;margin-bottom:8px;color:#ea4335}
#errorScreen p{font-size:14px;color:#aaa;max-width:300px;line-height:1.6;margin-bottom:20px;white-space:pre-line}
#errorScreen button{padding:12px 32px;border:none;border-radius:10px;background:#4a9eff;color:#fff;font-size:16px;font-weight:600;cursor:pointer}

#stepMsg{position:absolute;bottom:60px;left:0;right:0;text-align:center;font-size:13px;color:rgba(255,255,255,0.8);z-index:5}
</style>
</head>
<body>

<!-- Start screen -->
<div id="startScreen">
  <h1>料号二维码扫描器</h1>
  <p>用手机摄像头扫描产品外箱上的料号二维码，快速找到目标货物。</p>
  <button id="startBtn">开始扫描</button>
  <div class="note">需要允许摄像头权限</div>
</div>

<!-- Error screen -->
<div id="errorScreen">
  <h2>启动失败</h2>
  <p id="errorText"></p>
  <button id="errorRetry">重试</button>
</div>

<!-- Main app (hidden at start) -->
<div id="app" class="hidden">
  <div id="toolbar">
    <input type="text" id="searchInput" placeholder="输入要找的料号..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button id="modeBtn">查找模式</button>
    <button id="flashBtn" title="手电筒">&#x1F4A1;</button>
  </div>

  <div id="cameraWrap">
    <video id="video" autoplay playsinline webkit-playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="popup">
      <div class="label">料号</div>
      <div class="code" id="popupCode"></div>
      <button class="copyBtn" id="popupCopy">复制料号</button>
    </div>
    <div id="stepMsg"></div>
  </div>

  <div id="statusBar">准备就绪</div>
</div>

<script>
(function(){
  if (typeof BarcodeDetector === 'undefined') {
    showError('当前浏览器不支持二维码识别。\n请使用 Chrome 或 Edge 浏览器打开。');
    return;
  }

  /* ── DOM ── */
  var startScreen = document.getElementById('startScreen');
  var startBtn    = document.getElementById('startBtn');
  var errorScreen = document.getElementById('errorScreen');
  var errorText   = document.getElementById('errorText');
  var errorRetry  = document.getElementById('errorRetry');
  var app         = document.getElementById('app');
  var searchInput = document.getElementById('searchInput');
  var modeBtn     = document.getElementById('modeBtn');
  var flashBtn    = document.getElementById('flashBtn');
  var video       = document.getElementById('video');
  var overlay     = document.getElementById('overlay');
  var overlayCtx  = overlay.getContext('2d');
  var popup       = document.getElementById('popup');
  var popupCode   = document.getElementById('popupCode');
  var popupCopy   = document.getElementById('popupCopy');
  var statusBar   = document.getElementById('statusBar');
  var stepMsg     = document.getElementById('stepMsg');

  /* ── State ── */
  var mode = 'search';
  var searchQuery = '';
  var stream = null;
  var scanning = false;
  var animId = null;
  var lastScanTime = 0;
  var SCAN_INTERVAL = 180;
  var detectedCodes = [];
  var popupVisible = false;
  var flashOn = false;
  var videoReady = false;

  /* ── Coordinate transform ── */
  var tx = { scale: 1, offsetX: 0, offsetY: 0 };

  function updateTransform() {
    var cw = video.clientWidth, ch = video.clientHeight;
    var vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh || !cw || !ch) return;
    var scale = Math.max(cw / vw, ch / vh);
    tx.scale = scale;
    tx.offsetX = (cw - vw * scale) / 2;
    tx.offsetY = (ch - vh * scale) / 2;
  }

  function videoToCanvas(vx, vy) { return { x: tx.offsetX + vx * tx.scale, y: tx.offsetY + vy * tx.scale }; }
  function canvasToVideo(cx, cy) { return { x: (cx - tx.offsetX) / tx.scale, y: (cy - tx.offsetY) / tx.scale }; }

  function resizeOverlay() {
    var w = video.clientWidth, h = video.clientHeight;
    if (overlay.width !== w || overlay.height !== h) { overlay.width = w; overlay.height = h; }
    updateTransform();
  }

  /* ── Error screen ── */
  function showError(msg) {
    errorText.textContent = msg;
    errorScreen.classList.add('visible');
    startScreen.classList.add('hidden');
    app.classList.add('hidden');
  }

  errorRetry.addEventListener('click', function() {
    errorScreen.classList.remove('visible');
    startScreen.classList.remove('hidden');
  });

  /* ── Camera ── */
  function log(msg) {
    stepMsg.textContent = msg;
    statusBar.textContent = msg;
  }

  function startCamera() {
    log('请求摄像头权限...');

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' },
      audio: false
    }).then(function(s) {
      log('摄像头已连接，初始化画面...');
      stream = s;
      video.srcObject = s;

      video.onloadedmetadata = function() {
        log('画面就绪，启动中...');
        video.play().then(function() {
          log('');
          videoReady = true;
          resizeOverlay();
          startScanning();
          updateStatus();
          document.body.classList.add('scanning');
        }).catch(function(playErr) {
          showError('视频播放被阻止。\n请刷新页面后重试。\n错误: ' + playErr.name);
        });
      };

      setTimeout(function() {
        if (!videoReady && stream) {
          log('等待超时，强制启动...');
          video.play().then(function() {
            log('');
            videoReady = true;
            resizeOverlay();
            startScanning();
            updateStatus();
            document.body.classList.add('scanning');
          }).catch(function() {
            showError('摄像头已连接但无法播放画面。\n请刷新页面后重试。');
          });
        }
      }, 4000);
    }).catch(function(err) {
      if (err.name === 'NotAllowedError') {
        showError('摄像头权限被拒绝。\n\n解决方法：\n1. 打开手机"设置" → "应用" → 找到当前浏览器\n2. 点击"权限" → "相机" → 设为"允许"\n3. 返回浏览器刷新页面');
      } else if (err.name === 'NotFoundError') {
        showError('未找到摄像头。\n请确认手机有后置摄像头。');
      } else if (err.name === 'NotReadableError') {
        showError('摄像头被占用。\n请关闭其他相机应用后重试。');
      } else {
        showError('摄像头错误: ' + err.name + '\n' + err.message);
      }
    });
  }

  /* ── Start button ── */
  startBtn.addEventListener('click', function() {
    startScreen.classList.add('hidden');
    app.classList.remove('hidden');
    startCamera();
  });

  /* ── Flash ── */
  function toggleFlash() {
    if (!stream) return;
    var track = stream.getVideoTracks()[0];
    if (!track || typeof track.applyConstraints !== 'function') return;
    flashOn = !flashOn;
    track.applyConstraints({ advanced: [{ torch: flashOn }] }).catch(function() { flashOn = !flashOn; });
    flashBtn.style.background = flashOn ? 'rgba(255,200,50,0.3)' : 'rgba(255,255,255,0.12)';
  }
  flashBtn.addEventListener('click', toggleFlash);

  /* ── Scanning ── */
  function startScanning() {
    scanning = true;
    lastScanTime = 0;
    detectedCodes = [];
    scanLoop(0);
  }

  function scanLoop(timestamp) {
    if (!scanning) return;
    animId = requestAnimationFrame(scanLoop);
    resizeOverlay();
    if (timestamp - lastScanTime >= SCAN_INTERVAL) {
      lastScanTime = timestamp;
      detectQRs();
    }
    drawOverlay();
    updateStatus();
  }

  function detectQRs() {
    if (!videoReady || video.readyState < 1) return;
    if (!video.videoWidth || !video.videoHeight) return;

    try {
      var detector = new BarcodeDetector({ formats: ['qr_code'] });
      detector.detect(video).then(function(barcodes) {
        if (!scanning) return;
        var newCodes = [];
        for (var i = 0; i < barcodes.length; i++) {
          var bc = barcodes[i];
          var corners;
          if (bc.cornerPoints && bc.cornerPoints.length === 4) {
            corners = bc.cornerPoints.map(function(p) { return { x: p.x, y: p.y }; });
          } else {
            var bb = bc.boundingBox;
            corners = [{ x: bb.x, y: bb.y },{ x: bb.x+bb.width, y: bb.y },{ x: bb.x+bb.width, y: bb.y+bb.height },{ x: bb.x, y: bb.y+bb.height }];
          }
          newCodes.push({ data: bc.rawValue, corners: corners, color: getQRColor(bc.rawValue), id: hashCode(bc.rawValue) });
        }
        detectedCodes = newCodes;
      }).catch(function(err) {
        console.warn('Detect error:', err);
        detectedCodes = [];
      });
    } catch(e) {
      console.warn('BarcodeDetector failed:', e);
      detectedCodes = [];
    }
  }

  function getQRColor(data) {
    if (mode === 'browse') return 'green';
    if (!searchQuery) return 'green';
    return data.toUpperCase().indexOf(searchQuery.toUpperCase()) !== -1 ? 'green' : 'red';
  }

  function hashCode(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; }
    return h;
  }

  /* ── Drawing ── */
  var COLORS = {
    green: { fill: 'rgba(52,168,83,0.22)', stroke: '#34a853' },
    red:   { fill: 'rgba(234,67,53,0.22)', stroke: '#ea4335' }
  };

  function drawOverlay() {
    var ctx = overlayCtx, w = overlay.width, h = overlay.height;
    ctx.clearRect(0, 0, w, h);
    updateTransform();
    for (var i = 0; i < detectedCodes.length; i++) {
      var dc = detectedCodes[i], c = COLORS[dc.color];
      var tc = dc.corners.map(function(p) { return videoToCanvas(p.x, p.y); });

      ctx.fillStyle = c.fill;
      ctx.beginPath();
      ctx.moveTo(tc[0].x, tc[0].y);
      ctx.lineTo(tc[1].x, tc[1].y);
      ctx.lineTo(tc[2].x, tc[2].y);
      ctx.lineTo(tc[3].x, tc[3].y);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = c.stroke; ctx.lineWidth = 2.5; ctx.stroke();

      var len = 18;
      ctx.strokeStyle = c.stroke; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      drawBracket(ctx, tc[0],  1,  1, len);
      drawBracket(ctx, tc[1], -1,  1, len);
      drawBracket(ctx, tc[2], -1, -1, len);
      drawBracket(ctx, tc[3],  1, -1, len);

      var cx = (tc[0].x+tc[1].x+tc[2].x+tc[3].x)/4;
      var top = Math.min(tc[0].y, tc[1].y, tc[2].y, tc[3].y);
      drawLabel(ctx, dc.data, cx, top, c.stroke);
    }
  }

  function drawBracket(ctx, pt, dx, dy, len) {
    ctx.beginPath();
    ctx.moveTo(pt.x, pt.y + dy*len);
    ctx.lineTo(pt.x, pt.y);
    ctx.lineTo(pt.x + dx*len, pt.y);
    ctx.stroke();
  }

  function drawLabel(ctx, text, x, y, bgColor) {
    var dt = text.length > 22 ? text.substring(0,20)+'...' : text;
    var fs = 13;
    ctx.font = '600 '+fs+'px -apple-system,BlinkMacSystemFont,sans-serif';
    var tw = ctx.measureText(dt).width, pad = 7, ly = y - 8;
    var rx = x - tw/2 - pad, ry = ly - fs - pad;
    var rw = tw + pad*2, rh = fs + pad*2, r = 5;
    ctx.fillStyle = bgColor;
    ctx.beginPath();
    ctx.moveTo(rx+r, ry); ctx.lineTo(rx+rw-r, ry);
    ctx.quadraticCurveTo(rx+rw, ry, rx+rw, ry+r);
    ctx.lineTo(rx+rw, ry+rh-r);
    ctx.quadraticCurveTo(rx+rw, ry+rh, rx+rw-r, ry+rh);
    ctx.lineTo(rx+r, ry+rh);
    ctx.quadraticCurveTo(rx, ry+rh, rx, ry+rh-r);
    ctx.lineTo(rx, ry+r);
    ctx.quadraticCurveTo(rx, ry, rx+r, ry);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(dt, x, ly);
  }

  /* ── Tap handling ── */
  overlay.addEventListener('click', function(e) {
    if (mode !== 'browse') { hidePopup(); return; }
    var rect = overlay.getBoundingClientRect();
    var cx = e.clientX - rect.left, cy = e.clientY - rect.top;
    var vp = canvasToVideo(cx, cy);
    for (var i = detectedCodes.length-1; i >= 0; i--) {
      if (pointInQuad(vp, detectedCodes[i].corners)) {
        showPopup(detectedCodes[i].data, cx, cy);
        return;
      }
    }
    hidePopup();
  });

  function pointInQuad(pt, corners) {
    var inside = false, n = corners.length;
    for (var i=0, j=n-1; i<n; j=i++) {
      var xi=corners[i].x, yi=corners[i].y, xj=corners[j].x, yj=corners[j].y;
      if ((yi>pt.y)!==(yj>pt.y) && pt.x<(xj-xi)*(pt.y-yi)/(yj-yi)+xi) inside=!inside;
    }
    return inside;
  }

  function showPopup(data, cx, cy) {
    popupCode.textContent = data;
    var wrap = document.getElementById('cameraWrap');
    var ww=wrap.clientWidth, wh=wrap.clientHeight;
    var pw=260, ph=120;
    var left=cx-pw/2, top=cy-ph-20;
    if (left<10) left=10; if (left+pw>ww-10) left=ww-pw-10;
    if (top<10) top=cy+20; if (top+ph>wh-10) top=wh-ph-10;
    popup.style.left=left+'px'; popup.style.top=top+'px';
    popup.classList.add('visible'); popupVisible=true;
    popup._codeData = data;
  }

  function hidePopup() {
    popup.classList.remove('visible'); popupVisible=false; popup._codeData=null;
  }

  popup.addEventListener('click', function(e) { e.stopPropagation(); });
  popupCopy.addEventListener('click', function(e) {
    e.stopPropagation();
    var data = popup._codeData;
    if (!data) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(data).then(function() {
        popupCopy.textContent='已复制'; setTimeout(function(){popupCopy.textContent='复制料号'},1500);
      }).catch(function() { fallbackCopy(data); });
    } else { fallbackCopy(data); }
  });
  function fallbackCopy(text) {
    var ta=document.createElement('textarea');
    ta.value=text; ta.style.cssText='position:fixed;left:-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); popupCopy.textContent='已复制'; }
    catch(e) { popupCopy.textContent='复制失败'; }
    document.body.removeChild(ta);
    setTimeout(function(){popupCopy.textContent='复制料号'},1500);
  }

  /* ── Status ── */
  function updateStatus() {
    var n = detectedCodes.length;
    if (n===0) {
      statusBar.textContent = (mode==='search'&&searchQuery) ? '未检测到二维码，对准货物...' : '未检测到二维码';
    } else {
      if (mode==='search' && searchQuery) {
        var m = detectedCodes.filter(function(d){return d.color==='green'}).length;
        statusBar.textContent = '检测到 '+n+' 个，匹配 '+m+' 个';
      } else if (mode==='browse') {
        statusBar.textContent = '检测到 '+n+' 个，点击绿色区域查看料号';
      } else {
        statusBar.textContent = '检测到 '+n+' 个二维码';
      }
    }
  }

  /* ── Mode ── */
  function updateModeUI() {
    if (mode==='search') {
      modeBtn.textContent='查找模式'; modeBtn.classList.remove('browse');
      searchInput.style.display=''; hidePopup();
    } else {
      modeBtn.textContent='浏览模式'; modeBtn.classList.add('browse');
      searchInput.style.display='none'; searchInput.value=''; searchQuery=''; hidePopup();
    }
  }
  modeBtn.addEventListener('click', function() {
    mode = mode==='search' ? 'browse' : 'search';
    updateModeUI();
  });
  searchInput.addEventListener('input', function() { searchQuery = searchInput.value.trim(); });

  window.addEventListener('resize', resizeOverlay);
  window.addEventListener('orientationchange', function() { setTimeout(resizeOverlay, 300); });

  updateModeUI();
})();
</script>
</body>
</html>
